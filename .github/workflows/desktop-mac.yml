name: Build Mac app

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Build DMG (unsigned)
        run: npx electron-builder --mac dmg zip --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: DeepOS-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DeepOS for Mac ${{ github.ref_name }}
          body: |
            DeepOS for Mac: a floating focus timer and thought parking box that shows on every desktop.
            Download the .dmg, drag DeepOS to Applications, then open it.
            The app isn't signed yet: the first time, right-click DeepOS in Applications and choose Open
            (or allow it in System Settings → Privacy & Security).
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
